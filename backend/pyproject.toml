[project]
name = "county-government-backend"
version = "0.1.0"
description = "Local synthetic-development FastAPI foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.143.2,<0.144",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.0,<3",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "starlette>=0.46,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff==0.14.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
