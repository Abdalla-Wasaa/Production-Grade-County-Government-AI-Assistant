name: Security monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Install hash-verified tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/uv-bootstrap.txt
          uv venv .ci-venv
          uv pip sync --python .ci-venv/bin/python --require-hashes requirements-ci.lock
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Install and verify approved frontend toolchain
        run: |
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
          npm --prefix frontend ci
          npm --prefix frontend ls --all
      - name: Install checksum-verified Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          curl --fail --silent --show-error --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy/trivy.tar.gz"
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $RUNNER_TEMP/trivy/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Audit dependencies and monitor runtime images
        run: |
          python scripts/security_monitor.py --output .artifacts/monitor
      - name: Retain daily-security-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-security-evidence
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Job summary
        if: always()
        run: |
          echo "Validation outcome: $JOB_STATUS. Review failed steps and retained evidence; production remains blocked." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
