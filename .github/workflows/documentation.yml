name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Install hash-verified tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/uv-bootstrap.txt
          uv venv .ci-venv
          uv pip sync --python .ci-venv/bin/python --require-hashes requirements-ci.lock
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Repository policy lint and regression tests
        run: |
          python scripts/check_repository.py
          python scripts/check_ci_policy.py
          ruff check scripts tests/tooling
          ruff format --check scripts tests/tooling
          python -m pytest tests/tooling -q --junitxml=.artifacts/repository.xml
          git show --format= --check HEAD
      - name: Validate and sanitize repository report
        if: always()
        run: |
          python3 scripts/check_test_report.py --sanitize .artifacts/repository.xml
      - name: Retain repository-results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-results
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Job summary
        if: always()
        run: |
          echo "Validation outcome: $JOB_STATUS. Review failed steps and retained evidence; production remains blocked." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify scanner detects synthetic fixture
        run: |
          python3 scripts/test_secret_scanner.py
      - name: Scan history and current files
        run: |
          gitleaks git --redact --no-banner --log-opts="--all" .
          gitleaks dir --redact --no-banner .
      - name: Job summary
        if: always()
        run: |
          echo "Validation outcome: $JOB_STATUS. Review failed steps and retained evidence; production remains blocked." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
