name: Compose integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.nvmrc
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Install and verify approved frontend toolchain
        run: |
          test "$(node --version)" = v24.22.0
          test "$(npm --version)" = 11.19.1
          npm --prefix frontend ci
          npm --prefix frontend ls --all
      - name: Verify Docker and install Chromium
        run: |
          docker version
          docker compose version
          docker buildx version
          cd frontend
          npx --no-install playwright install --with-deps chromium
      - name: Container unit tests
        run: |
          python3 scripts/dev.py test-frontend
          python3 scripts/dev.py test-backend
      - name: Compose integration and Nginx browser smoke
        run: |
          python3 scripts/compose_smoke.py --browser --report "$RUNNER_TEMP/county-images.json" --cleanup-manifest "$RUNNER_TEMP/county-cleanup.json" --diagnostics .artifacts/compose-diagnostics.json
      - name: Install checksum-verified Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          curl --fail --silent --show-error --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy/trivy.tar.gz"
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $RUNNER_TEMP/trivy/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Complete image reports and development security decision
        run: |
          python3 scripts/scan_images.py "$RUNNER_TEMP/county-images.json" --output .artifacts/image-scans
      - name: Validate and sanitize Nginx browser report
        if: always()
        run: |
          python3 scripts/check_test_report.py --sanitize frontend/.artifacts/compose-browser.xml
      - name: Retain compose-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compose-evidence
          path: .artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Retain compose-browser
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compose-browser
          path: frontend/.artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Cleanup verified disposable resources
        if: always()
        run: |
          python3 scripts/compose_smoke.py --cleanup "$RUNNER_TEMP/county-cleanup.json"
      - name: Job summary
        if: always()
        run: |
          echo "Validation outcome: $JOB_STATUS. Review failed steps and retained evidence; production remains blocked." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
