name: Compose integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify Docker tooling
        run: |
          docker version
          docker compose version
          docker buildx version
      - name: Build frontend test image and run isolated unit tests
        run: python3 scripts/dev.py test-frontend
      - name: Build backend test image and run isolated unit tests
        run: python3 scripts/dev.py test-backend
      - name: Disposable Compose and PostgreSQL integration acceptance
        run: python3 scripts/compose_smoke.py --report "$RUNNER_TEMP/county-images.json" --cleanup-manifest "$RUNNER_TEMP/county-cleanup.json"
      - name: Install checksum-verified image scanner
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          curl --fail --silent --show-error --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy/trivy.tar.gz"
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $RUNNER_TEMP/trivy/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Report vulnerabilities and reject fixable high or critical findings
        run: python3 scripts/scan_images.py "$RUNNER_TEMP/county-images.json" --output "$RUNNER_TEMP/county-image-scans"
      - name: Retain complete vulnerability reports including unfixed findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-image-vulnerabilities
          path: ${{ runner.temp }}/county-image-scans/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup only verified resources from this acceptance invocation
        if: always()
        run: python3 scripts/compose_smoke.py --cleanup "$RUNNER_TEMP/county-cleanup.json"
