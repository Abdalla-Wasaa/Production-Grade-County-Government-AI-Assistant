name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Install hash-verified tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/uv-bootstrap.txt
      - name: Install locked backend
        run: |
          uv lock --project backend --check
          uv sync --project backend --locked
          uv pip check --python backend/.venv/bin/python
      - name: Lint format types and unit tests
        run: |
          cd backend
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked pytest -q -m "not integration" --junitxml=.artifacts/unit.xml
      - name: Validate and sanitize unit report
        if: always()
        run: |
          python3 scripts/check_test_report.py --sanitize backend/.artifacts/unit.xml
      - name: Retain backend-unit-results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-unit-results
          path: backend/.artifacts/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Verify lock integrity
        run: |
          git diff --exit-code -- backend/uv.lock
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Job summary
        if: always()
        run: |
          echo "Validation outcome: $JOB_STATUS. Review failed steps and retained evidence; production remains blocked." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
  postgresql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_PASSWORD: synthetic-ci-admin-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COUNTY_TEST_ADMIN_URL: postgresql+psycopg://postgres:synthetic-ci-admin-only@127.0.0.1:5432/postgres
      COUNTY_TEST_DISPOSABLE: "YES"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Install hash-verified tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/uv-bootstrap.txt
      - name: Install locked backend
        run: |
          uv lock --project backend --check
          uv sync --project backend --locked
          uv pip check --python backend/.venv/bin/python
      - name: Real PostgreSQL integration and packaged migrations
        run: |
          cd backend
          uv run --locked pytest -q -m integration --junitxml=.artifacts/postgresql.xml
          uv build --out-dir "$RUNNER_TEMP/backend-dist"
      - name: Validate and sanitize PostgreSQL report
        if: always()
        run: |
          python3 scripts/check_test_report.py --sanitize backend/.artifacts/postgresql.xml
      - name: Retain postgresql-results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-results
          path: backend/.artifacts/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Job summary
        if: always()
        run: |
          echo "Validation outcome: $JOB_STATUS. Review failed steps and retained evidence; production remains blocked." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
  python-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Install hash-verified tooling
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/uv-bootstrap.txt
          uv venv .ci-venv
          uv pip sync --python .ci-venv/bin/python --require-hashes requirements-ci.lock
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Audit runtime dev and repository tool dependencies
        run: |
          python scripts/audit_python.py --output .artifacts/python-audit
      - name: Retain python-dependency-reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-dependency-reports
          path: .artifacts/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-p105-${{ hashFiles('backend/uv.lock', 'requirements-ci.lock', 'frontend/package-lock.json', '.github/uv-bootstrap.txt') }}
      - name: Job summary
        if: always()
        run: |
          echo "Validation outcome: $JOB_STATUS. Review failed steps and retained evidence; production remains blocked." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
