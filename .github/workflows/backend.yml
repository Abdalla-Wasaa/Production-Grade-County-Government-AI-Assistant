name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install approved dependency tool
        run: python -m pip install --disable-pip-version-check uv==0.13.1
      - name: Validate and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked
          uv pip check --python .venv/bin/python
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format check
        run: uv run --locked ruff format --check .
      - name: Backend tests (no external services)
        run: uv run --locked pytest -q
      - name: Verify lock remains unchanged
        run: git -C .. diff --exit-code -- backend/uv.lock
