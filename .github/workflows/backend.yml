name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install approved dependency tool
        run: python -m pip install --disable-pip-version-check uv==0.13.1
      - name: Validate and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked
          uv pip check --python .venv/bin/python
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format check
        run: uv run --locked ruff format --check .
      - name: Backend tests (no external services)
        run: uv run --locked pytest -q -m "not integration"
      - name: Verify lock remains unchanged
        run: git -C .. diff --exit-code -- backend/uv.lock

  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-admin-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      UV_PYTHON_DOWNLOADS: never
      COUNTY_TEST_ADMIN_URL: postgresql+psycopg://postgres:synthetic-ci-admin-only@127.0.0.1:5432/postgres
      COUNTY_TEST_DISPOSABLE: "YES"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.1
          uv lock --check
          uv sync --locked
          uv pip check --python .venv/bin/python
      - name: Real PostgreSQL migrations and integration acceptance
        run: uv run --locked pytest -q -m integration
      - name: Build packaged migrations
        run: uv build --out-dir "$RUNNER_TEMP/backend-dist"
      - name: Verify lock remains unchanged
        run: git -C .. diff --exit-code -- backend/uv.lock
